[platformio]
; Keep a bare `pio run` building only the base env. The battery variant is
; opt-in via `pio run -e xiao_esp32c6_batt`.
default_envs = xiao_esp32c6

[env:xiao_esp32c6]
; Use the pioarduino fork — official platform-espressif32 still ships Arduino-ESP32 v2.x,
; which does NOT support the ESP32-C6. pioarduino bundles Arduino-ESP32 v3.x (IDF v5+).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
; NimBLE alone fits the default app partition, but huge_app is kept to avoid a
; repartition/full-erase churn for existing devices (no OTA, which we don't use).
; NOTE: changing the partition table requires a full flash erase on the first
; upload after the change: `pio run -t erase` then `pio run -t upload`.
board_build.partitions = huge_app.csv
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.0
    h2zero/NimBLE-Arduino @ ^2.2.3
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
; Rebuild the Arduino IDF libs with power management: automatic light sleep
; between BLE advertising events is the ~20 mA -> ~2 mA idle win. The BLE
; controller sleeps between events (BT_LE_SLEEP_ENABLE) and the RF MAC/baseband
; powers down in light sleep (PHY_MAC_BB_PD). First build after this change
; recompiles the framework libs and takes considerably longer.
custom_sdkconfig =
    CONFIG_PM_ENABLE=y
    CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
    CONFIG_BT_LE_SLEEP_ENABLE=y
    CONFIG_ESP_PHY_MAC_BB_PD=y
; Drop Arduino's bundled cloud/telemetry components: unused here, and
; esp_insights' embedded-cert build step breaks the hybrid compile.
custom_component_remove =
    espressif/esp_insights
    espressif/esp_diag_data_store
    espressif/esp_diagnostics
    espressif/esp_rainmaker
    espressif/rmaker_common
    espressif/esp_hosted
    espressif/esp_wifi_remote
    espressif/network_provisioning
    espressif/qrcode

; Optional battery-monitoring build. Identical to the base env plus the
; MAX17048 fuel-gauge addon (-DENABLE_BATTERY). The base firmware is unchanged;
; this just compiles in battery.cpp's I2C reads and the /status battery fields.
;   pio run -e xiao_esp32c6_batt -t upload
[env:xiao_esp32c6_batt]
extends = env:xiao_esp32c6
build_flags =
    ${env:xiao_esp32c6.build_flags}
    -DENABLE_BATTERY
